name: Feature request
description: Propose an improvement
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the use case with synthetic examples. Do not include secrets, credentials, private memory data, or `.env` contents.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or limitation should this feature address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and any alternatives considered.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility context
      description: List relevant opencode-memory, OpenCode, Bun, and operating system versions.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I have used synthetic examples and have not included secrets, credentials, private memory data, or `.env` contents.
          required: true
